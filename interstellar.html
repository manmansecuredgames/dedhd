<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>More pages</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 2rem 1rem; background: #10131b; color: #f5f7ff; }
    main { width: min(760px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 .4rem; }
    p { color: #b7bfd2; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    a.card { display: block; padding: 1.2rem; color: inherit; text-decoration: none; background: #1b2030; border: 1px solid #343b50; border-radius: 14px; transition: transform .15s, border-color .15s; }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: #8297ff; outline: none; }
    a.card strong { display: block; font-size: 1.15rem; }
    .back { display: inline-block; margin-top: .5rem; color: #b9c5ff; }
    .note { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>More pages</h1>
    <p>Quick links to the public Games, Apps, and Settings pages.</p>
    <div class="grid">
      <a class="card" href="https://gointerstellar.app/games" target="_blank" rel="noopener noreferrer"><strong>Games</strong><span>Open the games page</span></a>
      <a class="card" href="https://gointerstellar.app/apps" target="_blank" rel="noopener noreferrer"><strong>Apps</strong><span>Open the apps page</span></a>
      <a class="card" href="https://gointerstellar.app/settings" target="_blank" rel="noopener noreferrer"><strong>Settings</strong><span>Open the settings page</span></a>
    </div>
    <p class="note">These links open the pages directly in a new tab; they do not embed the proxy or alter either site's behavior.</p>
    <a class="back" href="/">← Back to dedhd</a>
  </main>
</body>
</html>
